/* ================= RAQBO black & gold theme ================= */
:root{--ink:#16140f;--muted:#7b7568;--muted-dark:#5a544a;--navy:#121212;--navy-deep:#0a0a0b;--teal:#c8942f;--teal-dark:#8a6213;--mint:#f8efdc;--paper:#f8f6f1;--sand:#f8f6f1;--line:#ece6da;--gold:#e3ad45;--gold-1:#f6d27c;--gold-2:#e2a63c;--gold-3:#b67d1c;--gold-grad:linear-gradient(135deg,#f8d785 0%,#e6ac42 48%,#c2851d 100%);--black:#0b0b0c;--black-2:#141416;--black-3:#1d1d20;--font-display:"Montserrat","DM Sans",Arial,sans-serif;--font-brand:"Montserrat","DM Sans",Arial,sans-serif;--focus-ring:0 0 0 3px rgba(227,173,69,.4);--radius-md:14px;--shadow-card:0 14px 40px rgba(17,14,8,.08)}
::selection{color:#111;background:var(--gold)}
body{background:#fff}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Buttons */
.button{border-radius:10px;font-family:var(--font-brand);letter-spacing:.02em}
.button-primary{border:0;color:#16120a;background:var(--gold-grad);box-shadow:0 10px 26px rgba(200,148,47,.28)}
.button-primary:hover{color:#16120a;background:var(--gold-grad);filter:brightness(1.06)}
.button-dark{color:#fff;background:#121212}.button-dark:hover{background:#262626}
.button-light{color:#121212;background:#fff}.button-light:hover{color:#16120a;background:var(--gold-grad)}
.button-ghost{border:1px solid rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.06)}
.button-ghost:hover{border-color:var(--gold);color:var(--gold-1)}
.button-whatsapp{border:0;color:#fff;background:#1fa855}.button-whatsapp:hover{background:#178c46}
.text-link{border-bottom-color:rgba(200,148,47,.45)}

/* Announcement & header */
.announcement{height:38px;color:#d9d3c5;background:#050505;border-bottom:1px solid rgba(227,173,69,.14);font-size:11px}
.announcement a{color:#e9e3d6;transition:color .15s}.announcement a:hover{color:var(--gold-1)}
.announcement-contact{display:flex;align-items:center;gap:18px}
.announcement-contact span{color:#6f6a60}
.announcement-dot{background:var(--gold)}
.site-header{height:82px;background:rgba(11,11,12,.94);border-bottom:1px solid rgba(227,173,69,.16)}
.brand{gap:12px}
.brand-logo{display:block;width:auto;height:48px}
.brand-word{color:#fff;font:800 21px/1 var(--font-brand);letter-spacing:.14em}
.brand-word small{margin-top:7px;color:var(--gold);font:600 7px/1 var(--font-brand);letter-spacing:.24em}
.main-nav a{color:#cfc9bc;font-family:var(--font-brand);font-size:12px;letter-spacing:.02em}
.main-nav a:hover{color:var(--gold-1)}
.sign-in-button{color:#f1ece1}.sign-in-button:hover{color:var(--gold-1)}
.nav-post{color:#16120a;background:var(--gold-grad);border-radius:8px}.nav-post:hover{color:#16120a;background:var(--gold-grad);filter:brightness(1.06)}
.mobile-menu-button{color:#f1ece1}
@media(max-width:800px){.site-header{height:70px}.main-nav{top:70px;border-bottom-color:#222;background:#0b0b0c}.main-nav a{border-bottom-color:#222}.brand-logo{height:40px}}

/* Notice */
.preview-notice{color:#4a3a12;background:#faf3e2;border-bottom-color:#efe1bd}

/* Hero */
.hero{background:#0b0b0c}
.hero-shade{background:linear-gradient(90deg,rgba(6,6,7,.93),rgba(8,8,9,.74) 45%,rgba(8,8,9,.28)),linear-gradient(0deg,rgba(6,6,7,.6),transparent 35%)}
.eyebrow{color:var(--teal-dark);font-family:var(--font-brand)}.eyebrow-light{color:var(--gold-1)}
.hero h1{font:800 clamp(2.6rem,4.6vw,4.1rem)/1.05 var(--font-display);letter-spacing:-.035em}
.hero h1 em{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy>p{color:rgba(255,255,255,.78)}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero-actions .button{min-height:46px}
.hero-proof{margin-top:26px}
.search-panel{border-radius:18px;background:rgba(255,255,255,.97)}
.search-tabs button.active{color:#16120a;background:var(--mint)}
.owner-check input:checked+.checkmark{border-color:var(--gold-3);background:var(--gold-3)}
.hero-bottom{border-top-color:rgba(227,173,69,.2)}

/* Trust strip */
.trust-icon{color:var(--gold-3);background:#f8efdc;font-family:var(--font-brand)}

/* Section headings */
.closing-inner h2,.direct-card h2,.how-intro h2,.section-heading h2{font-weight:700;letter-spacing:-.03em}

/* Property cards */
.property-card{border-color:#eee8dc;border-radius:16px}

.property-info h3{font-family:var(--font-brand);font-weight:700}

.tour-label{border-color:rgba(227,173,69,.6);background:rgba(10,10,11,.7);color:var(--gold-1)}
.results-bar{border-radius:14px}

/* Categories */
.category-card{border-radius:14px}.category-card:hover{border-color:rgba(200,148,47,.5)}
.category-symbol{color:#16120a;background:var(--gold-grad)}
.category-name{font-family:var(--font-brand)}.category-arrow{color:var(--gold-3)}

/* Immersive */
.immersive-section{background:radial-gradient(ellipse at 80% 50%,#2c2313 0,#141414 42%,#0b0b0c 80%)}

.immersive-copy li span{color:var(--gold-1)}
.immersive-orbit{border-color:rgba(227,173,69,.22)}.immersive-orbit-two{border-color:rgba(227,173,69,.13)}
.immersive-model>span{color:var(--gold-1);border-color:rgba(227,173,69,.45)}
.model-roof{background:linear-gradient(135deg,#f8d785,#b67d1c)}
.model-house{background:linear-gradient(120deg,#f2ede2 0 50%,#c9c1b0 50%)}
.model-house i{border-color:#b67d1c;background:linear-gradient(145deg,#e6ac42,#f8e9c4)}
.model-house b{background:#1d1d20}
.immersive-glass-card{border-color:rgba(227,173,69,.25);background:rgba(255,255,255,.07)}

/* Direct */
.direct-section{background:#0b0b0c}
.direct-photo{background-image:linear-gradient(90deg,rgba(6,6,7,.95),rgba(8,8,9,.84) 54%,rgba(8,8,9,.5)),url(https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=2000&q=82)}
.direct-card .eyebrow{color:var(--gold-1)}
.direct-card h2 em{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.direct-card li span{color:#16120a;background:var(--gold-grad)}
.passport-card{border-radius:16px;border-color:rgba(227,173,69,.3)}
.passport-top{color:var(--gold-3)}.passport-symbol{color:var(--gold-3);background:#f8efdc}
.passport-card h3{font-family:var(--font-brand);color:#121212}
.passport-row b{color:#1e6b45}.passport-row b.not-checked{color:#9a6a1f}
.passport-card>p{color:#6c6556;background:#f8f3e8}

/* Services */
.service-section{background:var(--paper)}
.service-grid{gap:16px;border:0}
.service-card{min-height:240px;border:1px solid var(--line)!important;border-radius:16px;background:#fff;transition:transform .2s,box-shadow .2s,border-color .2s}
.service-card:hover{transform:translateY(-4px);border-color:rgba(200,148,47,.55)!important;background:#fff;box-shadow:0 18px 40px rgba(17,14,8,.08)}
.service-icon{color:#16120a;background:var(--gold-grad)}
.service-card h3{font-family:var(--font-brand)}
.service-link{color:#1a8a4a}
.service-whatsapp-note{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 16px;border:1px solid #d7ecdf;border-radius:12px;color:#1e5a37;background:#effaf3;font-size:12px}

/* How it works */
.how-section{background:#0b0b0c}
.how-intro .eyebrow{color:var(--gold-1)}
.steps-list>div>span{color:var(--gold-1)}
.steps-list>div,.steps-list>div:first-child{border-color:rgba(227,173,69,.16)}
.how-intro>p,.steps-list p{color:#a9a395}

/* FAQ */
.faq-section{background:#fff}.faq-list summary{font-family:var(--font-brand)}.faq-list summary svg{color:var(--gold-3)}

/* Closing CTA */
.closing-cta{color:#16120a;background:var(--gold-grad)}
.closing-inner .eyebrow{color:#16120a}.closing-inner h2{color:#121212}.closing-inner p{color:rgba(22,18,10,.75)}
.closing-actions{display:flex;flex-wrap:wrap;gap:12px}
.closing-cta .button-light{color:#fff;background:#121212}.closing-cta .button-light:hover{color:var(--gold-1);background:#000}

/* Footer */
.site-footer{padding-top:60px;color:#a9a395;background:#0b0b0c}
.footer-main{grid-template-columns:1.4fr repeat(4,1fr);gap:40px}
.footer-logo{display:block;width:190px;height:auto}
.footer-brand-block>p{color:#a9a395}
.footer-column h3{color:#fff;font-family:var(--font-brand);letter-spacing:.06em;text-transform:uppercase;font-size:10px}
.footer-column a,.footer-column button{color:#a9a395;font-size:11px}
.footer-column a:hover,.footer-column button:hover{color:var(--gold-1)}
.footer-contact a{display:inline-flex;align-items:center;gap:8px}
.footer-contact svg{flex:0 0 auto;color:var(--gold)}
.social-row{display:flex;gap:10px;margin-top:16px}
.social-row a{width:auto;height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid #2a2a2d;border-radius:999px;color:#e9e3d6;font-size:11px}
.social-row a:hover{border-color:var(--gold);color:var(--gold-1)}
.footer-bottom{border-top-color:#222;color:#7b7568}.footer-bottom b{color:var(--gold)}
@media(max-width:1050px){.footer-main{grid-template-columns:repeat(3,1fr)}.footer-brand-block{grid-column:1/-1}}
@media(max-width:620px){.footer-main{grid-template-columns:repeat(2,1fr)}}

/* Floating WhatsApp */
.wa-float{position:fixed;z-index:40;right:22px;bottom:22px;display:inline-flex;align-items:center;gap:9px;padding:13px 18px;border-radius:999px;color:#fff;background:#1fa855;box-shadow:0 12px 30px rgba(17,80,45,.35);font:700 13px var(--font-brand);transition:transform .15s,background .15s}
.wa-float:hover{transform:translateY(-2px);background:#178c46}
body.modal-open .wa-float,body.admin-open .wa-float{display:none}
.preview-toast{bottom:88px;border-left:3px solid var(--gold);background:#121212}

/* Modals & forms */
.modal-card{border-radius:20px}
.modal-card h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em}
.wa-box{display:grid;gap:6px;padding:14px;border:1px solid #d7ecdf;border-radius:12px;color:#1e5a37;background:#effaf3;font-size:12px;line-height:1.6}
.otp-demo{border-color:var(--gold)}
.status-published,.status-handled,.status-reviewed{color:#1e6b45;background:#e3f3e9}

/* Admin top bar (dark to match logo) */
.admin-topbar{background:#0b0b0c;border-bottom-color:#222}
.admin-account{color:#a9a395}
.admin-account button{border-color:#2a2a2d;color:#f1ece1;background:#141416}
.admin-account button:hover{border-color:var(--gold);color:var(--gold-1)}
.admin-auth .brand-word{color:#121212}
.modal-form input[type=checkbox],.modal-form input[type=radio]{width:17px;height:17px;min-height:0;flex:0 0 17px;margin:1px 0 0;padding:0;accent-color:var(--gold-3)}
.footer-column button{font-family:inherit;font-weight:400;cursor:pointer}
.direct-card .button-dark{color:#16120a;background:var(--gold-grad)}.direct-card .button-dark:hover{filter:brightness(1.06);background:var(--gold-grad)}
.announcement-contact a{white-space:nowrap}@media(max-width:620px){.announcement-inner>.announcement-left{display:none}.announcement{height:34px;font-size:10px}.announcement-contact{gap:10px}}
@media(max-width:620px){.announcement-inner>span.announcement-left{display:none!important}}
.otp-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}.link-button:disabled{color:var(--muted);text-decoration:none;cursor:default}.grecaptcha-badge{visibility:hidden}.modal-form small a{color:var(--teal-dark);text-decoration:underline}
/* ================= Sign-in screen ================= */
body.gate-open{overflow:hidden}
body.gate-open .wa-float{display:none}
.auth-gate{position:fixed;z-index:58;inset:0;overflow-y:auto;display:grid;place-items:center;padding:28px 16px;background:radial-gradient(ellipse at 15% 20%,#2c2313 0,#111 45%,#0a0a0b 80%)}
.auth-shell{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1.05fr;overflow:hidden;border:1px solid rgba(227,173,69,.22);border-radius:24px;background:#0f0f10;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.auth-brand{display:flex;flex-direction:column;gap:22px;padding:44px 40px;color:#d9d3c5;background:linear-gradient(160deg,rgba(227,173,69,.12),rgba(0,0,0,0) 55%)}

.auth-contact{margin-top:auto;color:#a9a395;font-size:12px;line-height:1.8}.auth-contact a{color:#e9e3d6}.auth-contact a:hover{color:var(--gold-1)}

.auth-panel{display:flex;flex-direction:column;padding:40px;background:#fff}

.auth-lead{margin:0 0 20px;color:var(--muted-dark);font-size:13px;line-height:1.7}

.auth-tabs button{min-height:40px;border:0;border-radius:9px;color:var(--muted-dark);background:transparent;font:700 13px var(--font-brand)}
.auth-tabs button.active{color:#16120a;background:#fff;box-shadow:0 4px 14px rgba(17,14,8,.08)}

.auth-google:hover{border-color:var(--gold-3);background:#fffaf0;transform:none}
.auth-google-mark{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:#fff;background:#121212;font:800 13px var(--font-brand)}

.auth-panel .modal-form label{font-size:11px}
.auth-panel .modal-form input{min-height:46px;font-size:13px;border-radius:10px}
.auth-panel .modal-form input[readonly]{color:var(--muted-dark);background:#f6f4ef}
.auth-panel .modal-submit{min-height:50px;font-size:13px}
.otp-input{letter-spacing:.6em;text-align:center;font:700 22px var(--font-brand)!important}
.auth-foot{margin:auto 0 0;padding-top:22px;color:var(--muted);font-size:11px}
@media(max-width:820px){.auth-shell{grid-template-columns:1fr}.auth-brand{padding:28px 24px;gap:14px}.auth-brand ul,.auth-contact,.auth-social{display:none}.auth-logo{width:150px}.auth-brand h2{font-size:19px}.auth-panel{padding:26px 22px}}

.brand-icon{display:inline-block;flex:0 0 auto;width:16px;height:16px;object-fit:contain;vertical-align:middle}
.social-row .brand-icon{width:16px;height:16px}
.footer-contact .brand-icon{width:15px;height:15px}
.hero-actions .brand-icon,.closing-actions .brand-icon{width:20px;height:20px}
.wa-float .brand-icon{width:22px;height:22px}
.auth-google .brand-icon{width:20px;height:20px}
.link-danger{color:#a2463d!important}
.account-item-actions{flex-wrap:wrap;justify-content:flex-end}
.captcha-box{min-height:0;margin:2px 0}
.captcha-box:not(:empty){min-height:65px}

.upload-preview.is-existing span{color:var(--teal-dark)}
/* ================= Full property page ================= */
body.pp-open{overflow:hidden}
body.pp-open .wa-float{display:none}
.pp{position:fixed;z-index:57;inset:0;overflow-y:auto;background:#f8f6f1}
.pp-top{position:sticky;top:0;z-index:3;background:rgba(11,11,12,.96);border-bottom:1px solid rgba(227,173,69,.18)}
.pp-top-in{width:min(1240px,calc(100% - 32px));height:64px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.pp-back{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid #2a2a2d;border-radius:10px;color:#f1ece1;background:#141416;font:700 13px var(--font-brand)}

.pp-top-actions{display:flex;gap:8px}
.pp-icon-btn{padding:9px 14px;border:1px solid #2a2a2d;border-radius:10px;color:#f1ece1;background:#141416;font:700 13px var(--font-brand)}
.pp-icon-btn:hover,.pp-icon-btn.is-saved{border-color:var(--gold);color:var(--gold-1)}
.pp-wrap{width:min(1240px,calc(100% - 32px));margin:0 auto;padding:22px 0 60px}
.pp-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}

.pp-img{position:relative;z-index:1;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}
.pp-video{width:100%;height:100%;background:#000;object-fit:contain}

.pp-full{position:absolute;z-index:2;right:14px;bottom:14px;width:38px;height:38px;border:0;border-radius:10px;color:#fff;background:rgba(0,0,0,.6);font-size:18px}

.pp-loc{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--muted-dark);font-size:14px}

.au[hidden]{display:none}
.au-top-title{color:#f1ece1;font:800 14px var(--font-brand);letter-spacing:.14em;text-transform:uppercase}
.au-top-wa{display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.au-sample-note{padding:9px 16px;text-align:center;color:#5a4410;background:#f8efdc;border-bottom:1px solid #ecdcb4;font-size:12.5px}
.au-in{width:min(1180px,calc(100% - 32px));margin:0 auto}
.au-hero{position:relative;overflow:hidden;padding:86px 0 70px;color:#f1ece1;background:radial-gradient(ellipse at 85% 10%,rgba(227,173,69,.22),transparent 55%),radial-gradient(ellipse at 0% 100%,rgba(227,173,69,.12),transparent 50%),#0b0b0c}
.au-hero:after{content:"";position:absolute;inset:auto -10% -1px -10%;height:1px;background:linear-gradient(90deg,transparent,rgba(227,173,69,.6),transparent)}
.au-hero h1{max-width:780px;margin:16px 0 18px;color:#fff;font:800 clamp(34px,5.4vw,60px)/1.05 var(--font-display);letter-spacing:-.02em}
.au-hero p{max-width:680px;color:#bdb6a8;font-size:17px;line-height:1.7}
.au-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;max-width:900px;margin:42px 0 0;overflow:hidden;border:1px solid #2a2620;border-radius:16px;background:#2a2620}
.au-stats div{padding:22px 20px;background:#111113}
.au-stats b{display:block;font:800 34px/1 var(--font-display)}
.au-stats span{display:block;margin-top:8px;color:#a39c8e;font-size:12.5px;letter-spacing:.04em}
.au-jump{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.au-jump a{padding:9px 16px;border:1px solid #3a3326;border-radius:999px;color:#e9e3d6;font:700 12.5px var(--font-brand);text-decoration:none;transition:.15s}
.au-jump a:hover{border-color:var(--gold);color:#16120a;background:var(--gold-grad)}
.au-sec{padding:84px 0;scroll-margin-top:64px}
.au-soft{background:#f1ede4}
.au-dark{color:#f1ece1;background:#0b0b0c}
.au-sec h2,.au-cta h2{margin:12px 0 0;color:var(--ink);font:800 clamp(28px,3.6vw,42px)/1.1 var(--font-display);letter-spacing:-.015em}
.au-dark h2{color:#fff}
.au-kicker{color:var(--gold-3);font:800 11px var(--font-brand);letter-spacing:.2em}
.au-mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.au-mv-card{position:relative;padding:30px 30px 30px 34px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow-card)}
.au-mv-card:before{content:"";position:absolute;left:0;top:26px;bottom:26px;width:4px;border-radius:0 4px 4px 0;background:var(--gold-grad)}
.au-mv-card p{margin:12px 0 0;color:var(--ink);font:600 19px/1.5 var(--font-display)}
.au-values{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:8px}
.au-value{padding:24px;border:1px solid var(--line);border-radius:16px;background:#fff;transition:transform .2s,box-shadow .2s}
.au-value:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(17,14,8,.1)}
.au-value-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;color:#16120a;background:var(--gold-grad)}
.au-value h3{margin:16px 0 6px;font:800 16px var(--font-display);color:var(--ink)}
.au-value p{margin:0;color:var(--muted-dark);font-size:14px;line-height:1.6}
.au-founder{background:#fff}
.au-founder-grid{display:grid;grid-template-columns:420px minmax(0,1fr);gap:64px;align-items:center}
.au-founder-photo{position:relative}
.au-frame{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:22px;background:linear-gradient(160deg,#1d1d20,#0b0b0c);box-shadow:0 30px 60px rgba(0,0,0,.22)}
.au-frame:before{content:"";position:absolute;z-index:1;inset:12px;border:1px solid rgba(246,210,124,.55);border-radius:14px;pointer-events:none}
.au-frame img{width:100%;height:100%;object-fit:cover;display:block}
.au-monogram{position:absolute;inset:0;display:grid;place-items:center;font:800 110px var(--font-display);background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.au-founder-badge{position:absolute;left:24px;right:24px;bottom:-26px;z-index:2;padding:16px 20px;border-radius:14px;color:#f1ece1;background:#111113;border:1px solid rgba(227,173,69,.35);box-shadow:0 16px 30px rgba(0,0,0,.25)}
.au-founder-badge b{display:block;color:var(--gold-1);font:800 17px var(--font-display)}
.au-founder-badge span{font-size:12.5px;color:#bdb6a8}
.au-founder-msg{position:relative}
.au-quote{position:absolute;right:0;top:-30px;font:800 200px/1 Georgia,serif;color:rgba(227,173,69,.16);pointer-events:none}
.au-founder-msg p{margin:18px 0 0;color:#3c372e;font-size:16.5px;line-height:1.85}
.au-sign{display:flex;flex-direction:column;gap:3px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.au-sign-name{font:italic 600 26px Georgia,"Times New Roman",serif;color:var(--gold-3)}
.au-sign span:last-child{color:var(--muted);font-size:13px}
.au-head{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;margin-bottom:30px}
.au-head p{max-width:420px;margin:0;color:var(--muted-dark);font-size:15px;line-height:1.6}
.au-dark .au-head p{color:#a39c8e}
.au-car{position:relative;overflow:hidden;border-radius:22px;background:#000;box-shadow:0 30px 70px rgba(0,0,0,.28);outline:none}
.au-car:focus-visible{box-shadow:var(--focus-ring)}
.au-track{display:flex;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.au-slide{position:relative;flex:0 0 100%;margin:0;aspect-ratio:16/9;max-height:620px;width:100%}
.au-ph{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 30% 20%,#3a2e17,#0b0b0c 70%)}
.au-ph:before{content:attr(data-title);position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:rgba(246,210,124,.5);font:800 clamp(20px,3vw,34px) var(--font-display);letter-spacing:.04em}
.au-ph img{position:relative;width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04);transition:transform 6s ease}
.au-slide .au-ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.82) 100%)}
.au-car:hover .au-ph img{transform:scale(1)}
.au-cap{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding:34px 40px 58px;color:#fff}
.au-cap h3{margin:10px 0 6px;color:#fff;font:800 clamp(22px,3vw,34px)/1.1 var(--font-display)}
.au-cap-loc{display:flex;align-items:center;gap:6px;margin:0;color:var(--gold-1);font-weight:700;font-size:14px}
.au-cap-text{max-width:560px;margin:8px 0 0;color:#ddd6c8;font-size:14.5px;line-height:1.55}
.au-chip{display:inline-block;padding:5px 11px;border-radius:999px;color:#16120a;background:var(--gold-grad);font:800 10.5px var(--font-brand);letter-spacing:.12em;text-transform:uppercase}
.au-chip.live{color:#fff;background:#b3261e}
.au-progress{width:280px;flex:0 0 auto;padding:16px 18px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(10,10,11,.6);backdrop-filter:blur(8px)}
.au-progress-top{display:flex;justify-content:space-between;font-size:12.5px;color:#ddd6c8}
.au-progress-top b{color:var(--gold-1);font:800 18px var(--font-display)}
.au-progress-bar{height:8px;margin:10px 0 8px;overflow:hidden;border-radius:9px;background:rgba(255,255,255,.14)}
.au-progress-bar i{display:block;height:100%;border-radius:9px;background:var(--gold-grad)}
.au-progress small{color:#bdb6a8;font-size:12px}
.au-arrow{position:absolute;z-index:2;top:45%;width:50px;height:50px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:50%;color:#fff;background:rgba(0,0,0,.45);font-size:32px;line-height:1;cursor:pointer;transform:translateY(-50%);transition:.15s}
.au-arrow:hover{color:#16120a;background:var(--gold-grad);border-color:transparent}
.au-arrow.prev{left:18px}.au-arrow.next{right:18px}
.au-dots{position:absolute;z-index:2;left:40px;bottom:24px;display:flex;gap:8px}
.au-dots button{width:9px;height:9px;padding:0;border:0;border-radius:9px;background:rgba(255,255,255,.4);cursor:pointer;transition:width .3s,background .3s}
.au-dots button.active{width:30px;background:var(--gold)}
.au-count{position:absolute;z-index:2;right:40px;bottom:20px;color:#ddd6c8;font:600 13px var(--font-brand)}
.au-count b{color:var(--gold-1)}
.au-empty{color:var(--muted)}
.au-up-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.au-up{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s}
.au-up:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(17,14,8,.14)}
.au-up-img{position:relative;aspect-ratio:16/10}
.au-up-img img{position:relative;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9)}
.au-up-launch{position:absolute;left:14px;top:14px;z-index:1;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;color:#f6d27c;background:rgba(11,11,12,.85);font:800 11px var(--font-brand);letter-spacing:.06em}
.au-up-body{display:flex;flex:1;flex-direction:column;padding:20px 22px 22px}
.au-up-type{color:var(--gold-3);font:800 11px var(--font-brand);letter-spacing:.16em;text-transform:uppercase}
.au-up-body h3{margin:8px 0 6px;color:var(--ink);font:800 20px var(--font-display)}
.au-up-body .au-cap-loc{color:var(--muted-dark)}
.au-up-body p:not(.au-cap-loc){margin:10px 0 18px;color:var(--muted-dark);font-size:14px;line-height:1.6}
.au-up-btn{margin-top:auto;justify-content:center;gap:8px}
.au-up-btn img.brand-icon{width:16px;height:16px}
.au-cta{padding:70px 0 90px;text-align:center;color:#f1ece1;background:radial-gradient(ellipse at 50% 0,rgba(227,173,69,.2),transparent 60%),#0b0b0c}
.au-cta h2{color:#fff}
.au-cta p{color:#bdb6a8}
.au-cta-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:22px}
@media(max-width:1000px){.au-values{grid-template-columns:repeat(2,minmax(0,1fr))}.au-founder-grid{grid-template-columns:1fr;gap:56px}.au-founder-photo{max-width:420px}.au-up-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.au-hero{padding:56px 0 50px}.au-stats{grid-template-columns:1fr 1fr}.au-stats b{font-size:26px}.au-mv-grid,.au-values,.au-up-grid{grid-template-columns:1fr}.au-sec{padding:60px 0}.au-head{flex-direction:column;align-items:flex-start;gap:12px}
.au-slide{aspect-ratio:4/5}.au-cap{flex-direction:column;align-items:stretch;gap:14px;padding:22px 20px 52px}.au-progress{width:auto}.au-arrow{width:40px;height:40px;font-size:26px;top:38%}.au-arrow.prev{left:10px}.au-arrow.next{right:10px}.au-dots{left:20px;bottom:20px}.au-count{right:20px;bottom:16px}.au-top-title{display:none}.au-quote{font-size:130px}}
.au-cap{text-shadow:0 1px 12px rgba(0,0,0,.55)}
@media(max-width:700px){.au-slide .au-ph:after{background:linear-gradient(180deg,rgba(0,0,0,0) 12%,rgba(0,0,0,.6) 40%,rgba(0,0,0,.94) 72%)}.au-arrow{top:24%}.au-cap-text{font-size:13.5px}}
/* Official WhatsApp logo shown white on green WhatsApp buttons */

.social-row a{gap:8px}
.social-row{flex-wrap:wrap}
/* Footer: all social platforms in one horizontal row */
.footer-social{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:36px;padding:22px 0;border-top:1px solid #222;border-bottom:1px solid #222}
.footer-social-label{color:var(--gold);font:800 11px var(--font-brand);letter-spacing:.2em;text-transform:uppercase}
.footer-social .social-row{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;margin:0}
.footer-social .social-row a{height:40px;padding:0 16px;font-size:12.5px;font-weight:700}
.footer-social .social-row .brand-icon{width:20px;height:20px}
.wa-float .brand-icon{width:26px;height:26px}
@media(max-width:620px){.footer-social{justify-content:center}.footer-social .social-row{justify-content:center}}
@media(max-width:620px){.footer-social .social-row{flex-wrap:nowrap;gap:12px}.footer-social .social-row a{width:48px;height:48px;padding:0;justify-content:center;font-size:0;gap:0}.footer-social .social-row .brand-icon,.footer-social .social-row svg{width:24px;height:24px}}
.deal-switch .deal-sell{color:#16120a;background:var(--gold-grad);margin-left:3px}
.deal-switch .deal-sell:hover{filter:brightness(1.06)}
@media(min-width:801px) and (max-width:1180px){.main-nav{gap:14px}.main-nav a{font-size:11.5px}}
.main-nav a{white-space:nowrap}
@media(min-width:801px) and (max-width:1180px){.main-nav{gap:12px}.brand-word small{display:none}.nav-post{padding-left:14px;padding-right:14px}}
/* Password reset */
.auth-forgot{margin-top:2px;text-align:right}
.auth-forgot .link-button{color:var(--gold-3);font-weight:700}
.auth-back{display:block;margin:14px auto 0;color:var(--muted-dark)}
.auth-sent{text-align:center}
.auth-sent-icon{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 16px;border-radius:50%;color:#16120a;background:var(--gold-grad);font-size:28px;box-shadow:0 12px 28px rgba(200,148,47,.3)}
.auth-sent .modal-submit{width:100%;margin-top:18px}
@media(max-width:620px){.announcement-left{display:none}.announcement-inner{justify-content:center}}
/* standalone About us page */
body{margin:0;background:#f8f6f1}
.au-page .au-top{position:sticky;top:0;z-index:5}
.au-top-title{display:inline-flex;align-items:center;gap:10px}
.au-top-title img{display:block}
.au-footer{padding:22px 16px;text-align:center;color:#8f887a;background:#0b0b0c;border-top:1px solid #222;font-size:12.5px}
.au-footer a{color:var(--gold-1)}

/* About: final copy — pillars, founder photo with RAQBO logo, motto */
.au-hero p+p{margin-top:12px}
.au-pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;max-width:900px;margin:40px 0 0;overflow:hidden;border:1px solid #2a2620;border-radius:16px;background:#2a2620}
.au-pillars div{display:flex;align-items:center;gap:14px;padding:20px;background:#111113}
.au-pillars span{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;color:#16120a;background:var(--gold-grad)}
.au-pillars b{color:#f1ece1;font:700 15.5px/1.3 var(--font-display)}
.au-frame-mark{display:none}
.au-frame-logo .au-frame-mark{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,rgba(230,172,66,.18),transparent 62%)}
.au-frame-logo .au-frame-mark img{width:58%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.au-logo-tag{position:absolute;z-index:2;top:24px;right:24px;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:999px;background:rgba(11,11,12,.78);border:1px solid rgba(246,210,124,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.au-logo-tag img{width:30px;height:auto}
.au-logo-tag b{color:#f6d27c;font:800 12px var(--font-display);letter-spacing:.18em}
.au-frame-logo .au-logo-tag{display:none}
.au-motto{display:flex;align-items:center;gap:16px;margin-top:30px;padding:18px 20px;border-radius:16px;background:#111113;border:1px solid rgba(227,173,69,.35)}
.au-motto img{width:54px;height:auto;flex:none}
.au-motto b{display:block;color:var(--gold-1);font:800 15px var(--font-display);letter-spacing:.2em}
.au-motto span{display:block;margin-top:4px;color:#e8e2d5;font-size:14.5px;line-height:1.5}
.au-proj-sample{margin:-6px 0 18px;color:#a39c8e;font-size:12.5px}
.au-proj-sample b{color:#d9c89b}
@media(max-width:700px){.au-pillars{grid-template-columns:1fr}.au-pillars div{padding:16px}.au-logo-tag{top:18px;right:18px}.au-motto{align-items:flex-start}}

/* ===================== About — attention-grabbing redesign ===================== */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease var(--d,0ms),transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0ms)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
.gold-shine{background:linear-gradient(100deg,#d9932c 0%,#f6d27c 30%,#fff3cf 45%,#f6d27c 60%,#d9932c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{0%{background-position:100% 0}100%{background-position:-150% 0}}
/* hero */
.au-hero2{position:relative;overflow:hidden;padding:84px 0 40px;color:#f1ece1;background:#0b0b0c}
.au-hero2-bg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(227,173,69,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(227,173,69,.06) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 70%)}
.au-hero2-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 14s ease-in-out infinite}
.au-hero2-bg i:nth-child(1){width:420px;height:420px;right:4%;top:-120px;background:rgba(230,172,66,.35)}
.au-hero2-bg i:nth-child(2){width:300px;height:300px;left:-80px;bottom:-60px;background:rgba(230,172,66,.18);animation-delay:-5s}
.au-hero2-bg i:nth-child(3){width:220px;height:220px;left:45%;top:30%;background:rgba(255,220,150,.12);animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-24px)}}
.au-hero2-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center}
.au-hero2 h1{margin:18px 0 22px;color:#fff;font:800 clamp(40px,6.4vw,78px)/1.02 var(--font-display);letter-spacing:-.03em}
.au-h1a,.au-h1b{display:block}
.au-hero2 p{max-width:620px;margin:0 0 12px;color:#bdb6a8;font-size:16.5px;line-height:1.75}
.au-hero2 p.au-lead{color:#efe8da;font-size:19px}
.au-hero2-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.au-ghost{border:1px solid rgba(227,173,69,.55);color:#f6d27c;background:transparent}
.au-ghost:hover{background:rgba(227,173,69,.1)}
.au-orb{position:relative;aspect-ratio:1;max-width:440px;width:100%;justify-self:center}
.au-orb-ring{position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(227,173,69,.35);animation:spin 30s linear infinite}
.au-orb-ring:before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#f6d27c;box-shadow:0 0 18px #f6d27c}
.au-orb-ring.r2{inset:18%;border-style:dashed;border-color:rgba(227,173,69,.25);animation-duration:45s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.au-orb-core{position:absolute;inset:28%;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 40% 35%,#26221b,#0e0e10 70%);box-shadow:0 0 0 1px rgba(227,173,69,.4),0 30px 80px rgba(230,172,66,.25),inset 0 0 40px rgba(230,172,66,.12)}
.au-orb-core img{width:62%;height:auto;filter:drop-shadow(0 10px 24px rgba(230,172,66,.35));animation:bob 5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.au-float{position:absolute;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid rgba(227,173,69,.45);border-radius:999px;background:rgba(17,17,19,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#f1ece1;font:700 12.5px var(--font-brand);white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:bob 6s ease-in-out infinite}
.au-float svg{color:#f6d27c}
.au-float.c0{top:8%;left:-6%}.au-float.c1{top:48%;right:-8%;animation-delay:-2s}.au-float.c2{bottom:6%;left:4%;animation-delay:-4s}
.au-hero2 .au-jump{position:relative;margin-top:40px}
/* marquee */
.au-marquee{overflow:hidden;padding:16px 0;background:linear-gradient(90deg,#d9932c,#f6d27c,#e6ac42);color:#16120a}
.au-marquee-track{display:flex;width:max-content;animation:marq 34s linear infinite}
.au-marquee span{padding:0 22px;font:800 clamp(15px,1.8vw,20px) var(--font-display);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.au-marquee i{font-style:normal;opacity:.6}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.au-marquee-track,.au-orb-ring,.au-orb-core img,.au-float,.au-hero2-bg i,.gold-shine{animation:none}}
/* offer */
.au-offer{background:#f7f4ee}
.au-center{max-width:720px;margin:0 auto 40px;text-align:center}.au-center .eyebrow{justify-content:center}
.au-center h2{margin:12px 0 0;color:#121212;font:800 clamp(28px,3.6vw,44px)/1.12 var(--font-display);letter-spacing:-.02em}
.au-offer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.au-offer-card{position:relative;overflow:hidden;padding:30px 26px;border:1px solid #ebe3d3;border-radius:22px;background:#fff;box-shadow:0 18px 40px rgba(30,22,8,.06);transition:transform .35s,box-shadow .35s,border-color .35s}
.au-offer-card:hover{transform:translateY(-6px);border-color:rgba(227,173,69,.6);box-shadow:0 26px 56px rgba(30,22,8,.12)}
.au-offer-card:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold-grad);transform:scaleX(0);transform-origin:left;transition:transform .45s}
.au-offer-card:hover:after{transform:scaleX(1)}
.au-offer-n{position:absolute;top:18px;right:22px;color:#efe7d6;font:800 46px var(--font-display)}
.au-offer-ic{display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--gold-grad);color:#16120a;box-shadow:0 12px 26px rgba(230,172,66,.35)}
.au-offer-card h3{margin:20px 0 8px;color:#121212;font:800 20px var(--font-display)}
.au-offer-card p{margin:0;color:#5a544a;line-height:1.65}
/* story */
.au-story{background:#0b0b0c;color:#f1ece1}
.au-story-grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:64px;align-items:start}
.au-story-side{position:sticky;top:90px}
.au-story h2{margin:14px 0 28px;color:#fff;font:800 clamp(30px,3.8vw,46px)/1.08 var(--font-display);letter-spacing:-.02em}
.au-story .au-frame{box-shadow:0 30px 70px rgba(0,0,0,.5)}
.au-story .au-founder-badge{position:relative;left:auto;right:auto;bottom:auto;margin:-28px 20px 0}
.au-timeline{position:relative;margin:0;padding:0;list-style:none}
.au-timeline:before{content:"";position:absolute;left:23px;top:10px;bottom:10px;width:2px;background:linear-gradient(#e6ac42,rgba(230,172,66,.15))}
.au-timeline li{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr);gap:20px;padding:0 0 38px}
.au-tl-dot{position:relative;z-index:1;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#16120a;border:2px solid #e6ac42;color:#f6d27c;box-shadow:0 0 0 6px #0b0b0c,0 0 24px rgba(230,172,66,.35)}
.au-tl-n{display:block;margin:4px 0 8px;color:#f6d27c;font:800 13px var(--font-brand);letter-spacing:.16em;text-transform:uppercase}
.au-timeline p{margin:0;color:#d9d2c4;font-size:17px;line-height:1.8}
.au-tl-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.au-tl-chips span{padding:7px 12px;border:1px solid rgba(229,72,77,.45);border-radius:999px;background:rgba(229,72,77,.1);color:#ffb3b5;font:700 12.5px var(--font-brand)}
/* ambition quote */
.au-ambition{position:relative;padding:110px 0;text-align:center;background:radial-gradient(ellipse at 50% 0%,rgba(230,172,66,.18),transparent 60%),#111113;color:#fff;overflow:hidden}
.au-amb-mark{display:block;height:70px;color:rgba(230,172,66,.5);font:800 140px/1 Georgia,serif}
.au-amb-text{max-width:960px;margin:0 auto;font:800 clamp(26px,3.6vw,46px)/1.25 var(--font-display);letter-spacing:-.015em}
/* closing motto */
.au-motto2{padding:84px 0;background:#f7f4ee}
.au-motto2 .au-in{display:flex;align-items:center;justify-content:center;gap:42px}
.au-motto2-logo{width:140px;height:auto;filter:drop-shadow(0 18px 30px rgba(180,120,20,.25))}
.au-motto2-lines b{display:block;color:#121212;font:800 clamp(26px,3.4vw,44px)/1.18 var(--font-display);letter-spacing:-.02em}
.au-motto2-lines b:nth-child(2){color:#c58a22}
.au-motto2-lines b:nth-child(3){background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:1000px){.au-hero2-grid,.au-story-grid{grid-template-columns:1fr}.au-orb{max-width:340px}.au-story-side{position:static}.au-story-side .au-founder-photo{max-width:420px}.au-offer-grid{grid-template-columns:1fr}}
@media(max-width:700px){.au-hero2{padding:54px 0 30px}.au-float{font-size:11px;padding:7px 10px}.au-float.c0{left:0}.au-float.c1{right:0}.au-orb{max-width:300px}.au-ambition{padding:70px 0}.au-motto2 .au-in{flex-direction:column;text-align:center;gap:22px}.au-motto2-logo{width:100px}.au-timeline p{font-size:16px}}
@media(max-width:700px){.au-orb{max-width:300px;margin:10px auto 84px}.au-float.c0,.au-float.c1,.au-float.c2{left:0;right:0;margin:0 auto;width:max-content}.au-float.c0{top:-4%}.au-float.c1{top:auto;bottom:-10%}.au-float.c2{bottom:-25%}}
